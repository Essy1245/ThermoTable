<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#1E1B4B"/>
    </linearGradient>

    <!-- Thermal Dome Gradient (Cold Cyan to Hot Flame) -->
    <linearGradient id="domeGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="50%" stop-color="#818CF8"/>
      <stop offset="100%" stop-color="#F43F5E"/>
    </linearGradient>

    <!-- Fill Gradient -->
    <linearGradient id="fillGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#818CF8" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#38BDF8" stop-opacity="0.05"/>
    </linearGradient>

    <!-- Table Header Badge Gradient -->
    <linearGradient id="badgeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284C7"/>
      <stop offset="100%" stop-color="#6366F1"/>
    </linearGradient>

    <!-- Glow Effect -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- App Icon Base -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)"/>
  <rect x="8" y="8" width="496" height="496" rx="104" fill="none" stroke="#38BDF8" stroke-opacity="0.25" stroke-width="4"/>

  <!-- Table Grid Graphic Background -->
  <g opacity="0.15" stroke="#FFFFFF" stroke-width="3">
    <line x1="140" y1="80" x2="140" y2="430" />
    <line x1="256" y1="80" x2="256" y2="430" />
    <line x1="372" y1="80" x2="372" y2="430" />
    <line x1="70" y1="160" x2="442" y2="160" />
    <line x1="70" y1="240" x2="442" y2="240" />
    <line x1="70" y1="320" x2="442" y2="320" />
    <line x1="70" y1="400" x2="442" y2="400" />
  </g>

  <!-- Vapor Dome Saturation Fill & Stroke -->
  <path d="M 80 400 C 130 400 180 340 216 230 C 236 170 248 140 256 140 C 264 140 276 170 296 230 C 332 340 382 400 432 400 Z" fill="url(#fillGrad)"/>
  
  <path d="M 72 400 C 128 400 178 340 216 230 C 236 170 248 135 256 135 C 264 135 276 170 296 230 C 334 340 384 400 440 400" 
        fill="none" stroke="url(#domeGrad)" stroke-width="24" stroke-linecap="round" filter="url(#glow)"/>

  <!-- Critical Point Marker -->
  <circle cx="256" cy="135" r="16" fill="#F43F5E" stroke="#FFFFFF" stroke-width="6"/>

  <!-- Isobaric Property Line -->
  <path d="M 115 355 L 195 275 L 317 275 L 415 175" fill="none" stroke="#F59E0B" stroke-width="12" stroke-linecap="round" stroke-linejoin="round" opacity="0.95"/>
  <circle cx="195" cy="275" r="8" fill="#F59E0B" stroke="#FFFFFF" stroke-width="2"/>
  <circle cx="317" cy="275" r="8" fill="#F59E0B" stroke="#FFFFFF" stroke-width="2"/>

  <!-- SI Badge -->
  <g transform="translate(90, 85)">
    <rect x="0" y="0" width="88" height="50" rx="14" fill="url(#badgeGrad)"/>
    <text x="44" y="34" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="28" fill="#FFFFFF" text-anchor="middle" letter-spacing="1">SI</text>
  </g>
</svg>